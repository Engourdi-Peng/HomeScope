<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>HomeScope</title>
  <!-- Report typography: Poppins (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    * {
      box-sizing: border-box;
      /* 注意：不重置 margin/padding — 交给 Tailwind preflight 处理，
         无 layer 的 margin/padding:0 会覆盖 Tailwind utilities */
    }
    html, body {
      height: 100%;
      overflow: auto;
    }
    #root {
      height: 100%;
    }
  </style>
  <!-- 固定路径：与 vite extension 构建的 rollup output 一致；必须从 extension/dist 加载扩展 -->
  <link rel="stylesheet" href="./assets/sidepanel-ext.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./assets/sidepanel-ext.js"></script>
</body>
</html>
