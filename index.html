<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts (Poppins + Inter + Newsreader serif for editorial article reads) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="canonical" href="https://www.tryhomescope.com/" />
    
    <!-- SEO -->
    <title>HomeScope | AI Property Analyzer for Zillow Listings</title>
    <meta name="description" content="HomeScope helps home buyers review Zillow listings before booking a showing. Get AI property risk checks, photo and condition review, price confidence, and questions to ask the agent." />
    <meta name="keywords" content="Zillow AI tool, AI property analyzer, Zillow listing analysis, Zillow home buying analysis, property review tool, rental checker, screenshot analyzer Zillow" />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="HomeScope | AI Property Analyzer for Zillow Listings" />
    <meta property="og:description" content="Review Zillow listings before you book a showing. HomeScope checks listing risks, photos, price confidence, and questions to ask the agent." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tryhomescope.com/" />
    <meta property="og:image" content="https://www.tryhomescope.com/og-default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HomeScope | AI Property Analyzer for Zillow Listings" />
    <meta name="twitter:description" content="AI property risk reports for home buyers reviewing Zillow listings." />
    <meta name="twitter:image" content="https://www.tryhomescope.com/og-default.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "HomeScope",
      "applicationCategory": "BrowserApplication",
      "operatingSystem": "Chrome",
      "description": "AI property analyzer for home buyers reviewing Zillow listings before booking a showing.",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "6.99",
        "highPrice": "39.99",
        "priceCurrency": "USD",
        "offerCount": 3,
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter",
            "price": "6.99",
            "priceCurrency": "USD",
            "description": "1 Full Property Report"
          },
          {
            "@type": "Offer",
            "name": "Standard",
            "price": "15.99",
            "priceCurrency": "USD",
            "description": "3 Full Property Reports"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "39.99",
            "priceCurrency": "USD",
            "description": "10 Full Property Reports"
          }
        ]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HomeScope",
      "url": "https://www.tryhomescope.com/",
      "description": "AI property risk reports for home buyers reviewing Zillow listings."
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HomeScope",
      "url": "https://www.tryhomescope.com/",
      "logo": "https://www.tryhomescope.com/logo.svg",
      "sameAs": [
        "https://www.tryhomescope.com/blog"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
